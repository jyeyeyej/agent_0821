services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
      POSTGRES_USER: ${POSTGRES_USER:-parking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker}
    ports:
      - "5432:5432"
    volumes:
      - parking_postgres_data:/var/lib/postgresql/data
      # - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  parking_postgres_data:
